<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEFORE THE STARS 人物図鑑 — Ver.1.0 β14</title>
<style>
body{margin:0;background:#10181d;color:#f1ead7;font-family:"Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#26353b,#141f24);border-bottom:3px solid #b89442;padding:14px 18px 12px;box-shadow:0 6px 20px #0008}
.title-en{font-family:Palatino,Georgia,serif;font-size:34px;font-style:italic;font-weight:700;color:#ffe27c;line-height:1}.title-ja{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:18px;color:#efd696;letter-spacing:.12em;margin-top:4px}.subtitle{margin-top:10px;color:#c6d2d5;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.controls button,.controls select{background:#23343a;color:#f5f1e4;border:1px solid #6f876f;padding:8px 12px;font-weight:700}.controls button.active{background:#8c6c2e;border-color:#d6b16a;color:#fff6df}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px}.sidebar{background:#172329;border:2px solid #4f6268;padding:12px;align-self:start;position:sticky;top:132px;max-height:calc(100vh - 150px);overflow:auto}.sidebar h2{margin:0 0 10px;font-size:18px;color:#ffe07f}.sidebar .count{font-size:12px;color:#cbd8db;margin-bottom:10px}.list-item{display:block;width:100%;text-align:left;background:#0f181c;color:#e9efe8;border:1px solid #40545b;padding:8px 10px;margin:6px 0;font-size:13px;font-weight:700}.list-item small{display:block;color:#b8c2c5;font-weight:400;margin-top:2px}.list-item:hover{background:#23343a}.content{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px}.card{background:linear-gradient(180deg,#1c2930,#111a1f);border:2px solid #586c73;box-shadow:0 8px 20px #0006;padding:12px;min-width:0;scroll-margin-top:190px}.head{display:grid;grid-template-columns:126px minmax(0,1fr);gap:12px}.portrait{width:126px;height:154px;border:2px solid #8b7741;background:#0d1418;object-fit:cover}.name{font-size:25px;font-weight:900;color:#ffe07f;line-height:1.15}.meta{color:#d0dadd;font-size:13px;line-height:1.5;margin-top:4px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.badge{padding:3px 7px;border:1px solid #617078;font-size:11px;font-weight:700}.badge.patriot{background:#183b61;color:#dbeeff;border-color:#6ea1d4}.badge.british{background:#5a1f28;color:#ffe3e5;border-color:#cb7d88}.badge.availability{background:#42351d;color:#ffe8b2;border-color:#c8a559}.badge.group{background:#193128;color:#d8f1df;border-color:#6ea27e}.stats{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:5px}.stat{display:grid;grid-template-columns:2em minmax(0,1fr) 3ch;gap:8px;align-items:center;padding:6px 8px;background:#101b21;border:1px solid #344951;border-radius:3px;font-size:13px}.stat-label{font-weight:700;white-space:nowrap}.stat-value{font-size:14px;text-align:right;font-variant-numeric:tabular-nums;color:#ffe5a2}.meter{height:10px;background:#0a1115;border:1px solid #48606a;position:relative}.meter i{display:block;height:100%;background:linear-gradient(90deg,#cba74f,#eed98b)}.traits{margin-top:8px;color:#e7f2ed;font-size:13px}.traits strong{color:#ffe07f}.bio{margin-top:10px;border-top:1px solid #506169;padding-top:10px}.bio h3{margin:0 0 8px;color:#ffe07f;font-size:16px}.bio ul{margin:0;padding-left:18px}.bio li{margin:5px 0;font-size:13px;line-height:1.55;color:#ebf1f2}.top-actions{margin-top:10px}.top-actions a{color:#ffe5a2;text-decoration:none;border-bottom:1px dotted #ffe5a2}
@media (max-width:480px){.layout{padding:10px}.head{grid-template-columns:100px minmax(0,1fr);gap:10px}.portrait{width:100px;height:124px}.name{font-size:21px}}
@media (max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.content{grid-template-columns:1fr}}
</style></head><body>
<header><div class="title-en">BEFORE THE STARS</div><div class="title-ja">人物図鑑 / Commander Almanac</div><div class="subtitle">独立派・王党派・外国勢・副官まで、現在登場予定の全人物を収録しています。</div><div class="controls"><button data-faction="ALL" class="active">全人物</button><button data-faction="PATRIOT">アメリカ独立派</button><button data-faction="BRITISH">イギリス王党派</button><select id="availability-filter"><option value="ALL">登場区分：すべて</option><option>初期登場</option><option>予備役</option><option>派遣候補</option><option>特別参戦</option><option>副官</option></select><select id="group-filter"><option value="ALL">分類：すべて</option></select></div><div class="top-actions"><a href="game.html">ゲーム本体へ戻る</a></div><div class="subtitle">Ver.1.0 β14 · © 2026 さつまいモナ（satumaimona） · <a style="color:#ffe5a2" href="../about.html" target="_blank" rel="noopener">クレジット・利用条件</a></div></header>
<div class="layout"><aside class="sidebar"><h2>人物一覧</h2><div class="count" id="entry-count"></div><div id="name-list"></div></aside><main id="card-list" class="content"></main></div>
<script src="commander_encyclopedia_data_v0_82.js"></script>
<script>
(()=>{
 const returnLink=document.querySelector('.top-actions a');
 const embedded=new URLSearchParams(location.search).get('embedded')==='1'&&window.parent!==window;
 if(embedded){
   returnLink.addEventListener('click',event=>{event.preventDefault();window.parent.postMessage({type:'BTS_ALMANAC_CLOSE'},'*');});
   document.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();window.parent.postMessage({type:'BTS_ALMANAC_CLOSE'},'*');}});
 }
 const data=window.COMMANDER_ENCYCLOPEDIA_V0_82; const cards=document.getElementById('card-list'); const list=document.getElementById('name-list'); const count=document.getElementById('entry-count');
 let faction='ALL'; let availability='ALL'; let group='ALL';
 const groupFilter=document.getElementById('group-filter');
 const uniqueGroups=[...new Set(data.entries.map(e=>e.subgroup))]; uniqueGroups.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;groupFilter.appendChild(o);});
 function filtered(){ return data.entries.filter(e=>(faction==='ALL'||e.faction===faction)&&(availability==='ALL'||e.availability===availability)&&(group==='ALL'||e.subgroup===group)); }
 function statRow(label,val){ return `<div class="stat"><span class="stat-label">${label}</span><div class="meter"><i style="width:${Math.max(0,Math.min(100,Number(val)||0))}%"></i></div><strong class="stat-value">${val}</strong></div>`; }
 function badges(e){ return `<span class="badge ${e.faction==='PATRIOT'?'patriot':'british'}">${e.faction==='PATRIOT'?'独立派':'王党派'}</span><span class="badge availability">${e.availability}</span><span class="badge group">${e.subgroup}</span>`; }
 function render(){ const items=filtered(); count.textContent=`${items.length} / ${data.entry_count} 件を表示中`; cards.innerHTML=items.map(e=>`<article class="card" id="${e.id}"><div class="head"><img class="portrait" src="${e.portrait}" alt="${e.name}の肖像"><div><div class="name">${e.name}</div><div class="meta">${e.historical_rank} / ${e.role}</div><div class="meta">登場区分：${e.availability}${e.variant_label?' / '+e.variant_label:''}</div><div class="badges">${badges(e)}</div><div class="traits"><strong>特徴：</strong>${(e.traits||[]).join(' / ')||'—'}</div></div></div><div class="stats">${statRow('統率',e.stats?.leadership)}${statRow('戦術',e.stats?.tactics)}${statRow('補給',e.stats?.logistics)}${statRow('政治',e.stats?.politics)}${statRow('人望',e.stats?.charisma)}</div><div class="bio"><h3>人物略歴</h3><ul>${(e.biography||[]).map(t=>`<li>${t}</li>`).join('')}</ul></div></article>`).join(''); list.innerHTML=items.map(e=>`<button class="list-item" data-jump="${e.id}">${e.name}<small>${e.subgroup} / ${e.availability}</small></button>`).join(''); list.querySelectorAll('[data-jump]').forEach(btn=>btn.addEventListener('click',()=>document.getElementById(btn.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'}))); }
 document.querySelectorAll('[data-faction]').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('[data-faction]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); faction=btn.dataset.faction; render(); }));
 document.getElementById('availability-filter').addEventListener('change',e=>{availability=e.target.value; render();});
 groupFilter.addEventListener('change',e=>{group=e.target.value; render();});
 render();
})();
</script></body></html>
